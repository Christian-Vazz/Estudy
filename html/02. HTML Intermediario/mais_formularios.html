        Gênero: <br>
        <input type="radio" name="genero" value="masculino" id="masculino">
        <label for="masculino">Masculino</label>

        <input type="radio" name="genero" value="feminino" id="feminino">
        <label for="feminino">Feminino</label>

        <input type="radio" name="genero" value="outro" id="outro">
        <label for="outro">Outro</label> <br>

        <br>

        Estilo Musical: <br>
        <input type="checkbox" name="estilo" id="rock" value="rock">
        <label for="rock">Rock</label>

        <input type="checkbox" name="estilo" id="sertanejo" value="sertanejo">
        <label for="sertanejo">Sertanejo</label>

        <input type="checkbox" name="estilo" id="pop" value="pop">
        <label for="pop">Pop</label> 

        <br><br>

        <label for="estados">Estados:</label>
        <select name="estados[]" id="estados" multiple size="1">
            <option value="non-value">----</option>
            <option value="sp">São Paulo</option>
        </select>

        <br><br>

        <label for="arquivo">Arquivo:</label>
        <input type="file" name="arquivo" id="arquivo">

        <br><br>

        <input type="submit" value="Mandar">
        
    </form>
