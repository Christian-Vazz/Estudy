<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Formulários</title>
</head>
<body>
    <h1>Exercícios de Formulários</h1>

    <form action="">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="nome">Nome:</label> <br>
            <input type="name" name="nome" id="nome">
        
            <br>
            <label for="email">Email:</label> <br>
            <input type="email" name="email" id="email">
            <br>
            <input type="checkbox" name="receber-email" id="receber-email" value="ativado">
            <label for="receber-email">Quero receber e-mail</label>
            <br><br>
            <label for="senha">Senha:</label> <br>
            <input type="password" name="password" id="senha">
        </fieldset>

        <fieldset>
            <legend>Informações Adicionais</legend>
            <input type="radio" name="pessoa" id="fisica" value="fisica">
            <label for="fisica">Pessoa Física</label>
            <input type="radio" name="pessoa" id="juridica" value="juridica">
            <label for="juridica">Pessoa Jurídica</label>
        </fieldset>

        <input type="submit" name="botao" value="Cadastrar">
    </form>

    <br>

    
</body>
</html>
