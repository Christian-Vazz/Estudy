<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas Ordenadas e Não Ordenadas</title>
</head>
<body>
    <!--
        <ul> Unordered List (ul)
        <li> Item da lista
    -->
    <ul >
        <li>Veículos</li>
        <li>Tecnologia</li>
        <li>Tecnologia</li>
        <li>Tecnologia</li>
        <li>
            Tecnologia
            <ul>
                <li>Item dentro</li>
            </ul>
        </li>
    </ul>

    <!-- <ol> Ordened List -->
    <ol type="I" start="15">
        <li>Primeiro</li>
        <li>Segundo</li>
        <li>Terceiro</li>
    </ol> 
</body>
</html>
