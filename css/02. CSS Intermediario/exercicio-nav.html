<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra de Navegação Simples</title>

    <style>
        a {
            color: purple;
            padding: 5px 10px;
            text-decoration: none;
        }

        a:hover {
            background-color: purple;
            color: white;
        }

        a:active {
            color: lightgrey;
        }

    </style>
</head>
<body>
    <div class="navegacao">
        <a href="">Home</a> |
        <a href="">Sobre</a> |
        <a href="">Empresa</a> |
        <a href="">Produtos</a> |
        <a href="">Contato</a>
    </div>
</body>
</html>
