<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porcentagem e Pixel</title>

    <style>
        body{
            border: 2px solid green;
        }

        .pixel {
            border: 1px solid black;
            background: red;
            padding: 8px;
            width: 200px;
        }

        .porcentagem {
            border: 1px solid black;
            background: red;
            padding: 8px;
            width: 50%;
        }

        .vw {
            border: 1px solid black;
            background-color: red;
            padding: 8px;
            width: 50vw;
        }

        #area {
            border: 3px solid black;
            width: 500px;
        }

        .border{
            border: 1px solid black;
        }

    </style>
</head>
<body>
    <div class="pixel border">Pixel é a menor parte de uma i</div>
    <div class="porcentagem border">Porcentagem</div>
    <div class="vw border">VW (50VW)</div>
</body>
</html>
