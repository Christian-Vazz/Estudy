<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>
        body{
            background-color: black;
            color: white;
        }

        div.container-flex {
            display: flex;
            border: 1px solid brown;
            flex-direction: column;
        }

        div.container-flex div {
            border: 1px solid red;
            margin: 5px;
            padding: 2px;
        }

    </style>
</head>
<body>
    <h1>Display Flex</h1>

    <div class="container-flex">
        <div>01</div>
        <div>02</div>
        <div>03</div>
        <div>04</div>
        <div>05</div>
        <div>06</div>
        <div>07</div>
        <div>08</div>
        <div>09</div>
        <div>10</div>
    </div>
</body>
</html>
