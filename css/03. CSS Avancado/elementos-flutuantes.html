<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos Flutuantes</title>

    <style>

        .caixa {
            background-color: blue;
            width: 100px;
            height: 100px;
            border: 3px solid red;
            margin: 5px;
        }

        .esquerda {
            float: left;
        }
        
        .direita {
            float: right;
        }
    </style>
</head>
<body>
    <div class="caixa esquerda">
        Caixa 1
    </div>

    <div class="caixa">
        Caixa 2
    </div>

    <div class="caixa direita">
        Caixa 3
    </div>
</body>
</html>
