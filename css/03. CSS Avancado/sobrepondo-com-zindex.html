<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobreposição de Elementos</title>

    <style>

        #container {
            background-color: rgb(119, 43, 106);
            position: relative;
            width: 900px;
        }
        
        #tempo {
            background-color: orange;
            color: white;
            position: absolute;
            left: 55px;
            bottom: 54px;
            font-weight: 600;
            text-align: center;
            width: 150px;
            padding: 15px;
            border-radius: 20px;
        }

        #promocao {
            background-color: white;
            color: rgb(119, 43, 106);
            position: absolute;
            left: 175px;
            bottom: -40px;
            border: 3px dotted rgb(119, 43, 106);
            width: 500px;
            text-align: center;
            padding: 25px;
            border-radius: 40px;
            border-top-right-radius: 10px;
            border-top-left-radius: 10px;
        }


        
    </style>
</head>
<body>
    <h1>Exercício</h1>

    <div id="container">
        <img src="./imgs/banner.png" id="imagem">

        <div id="tempo">
            Tempo Limitado
        </div>

        <div id="promocao">
            Quero a Promocão
        </div>

    </div>
</body>
</html>
