<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegação Vertical</title>

    <style>
        #container {
            background-color: #FDAC24;
            width: 200px;
        }

        ul {
            padding-inline-start: 0;
            list-style-type: none;
        }

        span {
            color: white;
        }

        a:link, a:visited {
            text-decoration: none;
            color: black;
            display: block;
            padding: 5px;
        }

        a:hover{
            background-color: #ff7b00;
            color: white;
            padding: 10px;
        }

        a:active {
            background-color: #885000;
        }
        
    </style>
</head>
<body>
    <h1>Menu de Navegação</h1>

    <div id="container">
        <ul>
            <li>
                <a href=""><span>►</span> Home</a>
            </li>

            <li>
                <a href=""><span>►</span> Produtos</a>
            </li>

            <li>
                <a href=""><span>►</span> Carrinho</a>
            </li>

            <li>
                <a href=""><span>►</span> Contato</a>
            </li>
        </ul>
    </div>
</body>
</html>
