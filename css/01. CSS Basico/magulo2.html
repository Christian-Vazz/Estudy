<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magalu</title>
    <style>
        div.cabecalho{
            background-color: rgb(0, 123, 255);
            padding: 5px;
        }

        div.cabecalho > img{
            width: 150px;
            margin-right: 10px;
        }

        div.cabecalho > ul{
            list-style: none;
        }

        li{
            display: inline-block;
        }

        a{
            text-decoration: none;
            background-color: rgba(255, 255, 255, 0.558);
            border-radius: 5px;
            padding: 5px;
        }

        div.promocao{
            background-color: rgb(135, 47, 148);
        }

        div.promocao > img{
            width: 500px;
        }

        div.imagens{
            width: 900px;
            margin: 0 auto;
        }

        div.imagens > img{
            width: 170px;
        }

    </style>
</head>
<body>
    <div class="cabecalho">
        <img src="./img/logo-magalu.png" alt="Imagem da Loja online Magalu">

        <a href="">Oferta do Dia</a>
        <a href="">Celulares</a>
        <a href="">Eletrodomésticos</a>
        <a href="">TV e Vídeo</a>
        <a href="">Informática</a>  
    </div>

    <div class="promocao">
        <img src="./img/banner.png" alt="">
    </div>

    <div class="produtos">
        <div class="imagens">
            <h2>Produtos</h2>
            <img src="./img/produto1.jpg">
            <img src="./img/produto2.jpg">
            <img src="./img/produto3.jpg">
            <img src="./img/produto4.jpg">
            <img src="./img/produto5.jpg">
        </div>
    </div>
</body>
</html>
