<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bordas</title>

    <style>
        h1{
            background-color: orange;
            border-top-right-radius: 20px;
            border-top-left-radius: 20px;
            padding: 10px;
            font-size: 50px;
            border-bottom-style: dotted;
            border-bottom-width: 7px;
        }

        p{
            background-color: lightsteelblue;
            border-radius: 20px;
            padding: 8px;
            border-right: 12px solid darkslateblue;
            border-left: 12px solid darkslateblue;
        }
    </style>
</head>
<body>
    <h1>Modelo de Caixa</h1>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Magnam, repudiandae tempora recusandae itaque, veniam beatae, expedita doloremque dolor perspiciatis iusto alias esse maxime soluta fugit asperiores neque. Dolore, doloribus cupiditate?</p>
</body>
</html>
