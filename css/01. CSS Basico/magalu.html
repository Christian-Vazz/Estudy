<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magalu - Exercício</title>
    <style>
        div.nav{
            background-color: rgb(0, 140, 255);
        }

        a{
            color: white;
        }

        div>span{
            background-color: white;

        }

        div.oferta{

        }

        div.rodape>p{

            color: white;
        }

        div.rodape>p>span{
            color: blue;
        }

    </style>
</head>
<body>
    <div class="nav">
        <img src="./img/logo-magalu.png" height="30">
        <a href="">Oferta do Dia</a>

        <a href="">TV e Vídeo</a>
        <a href="">Informática</a>
        <span>Compre pelo tel: 0800 70 70 70</span>
    </div>

    <div class="oferta">
        <img src="./img/banner.png" height="200">
    </div>

    <div class="produtos">
        <h3>Novidades que selecionamos</h3>
        <img src="./img/produto1.jpg" height="200">
        <img src="./img/produto2.jpg" height="200">
        <img src="./img/produto3.jpg" height="200">
        <img src="./img/produto4.jpg" height="200">
        <img src="./img/produto5.jpg" height="200">
    </div>

    <div class="rodape">
        <p><span>Magazine Luiza</span> Todos os Direitos Reservados</p>
    </div>
</body>
</html>
