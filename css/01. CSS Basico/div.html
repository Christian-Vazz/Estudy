<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div e Span</title>
    <style>
        span{
            background-color: black;
            color: white;
        }

        div.nav{
            border-bottom: 3px solid black;
        }

        div.group-pilotos{
            background-color: rgb(184, 183, 183);
            margin-bottom: 20px;
        }

        div.rodape{
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <div class="nav">
        <img src="./img/logo-f1.png" height="58">
        <a href="">Recente</a>
        <a href="">Vídeo</a>
        <a href="">Agenda de Corridas</a>
        <a href="">Pilotos</a>
        <span>Grupo Liberty Media</span>
    </div>

    <div class="group-pilotos">
        <h2>Grandes Pilotos da Fórmula 1</h2>
        <p>Alguns dos melhores pilotos da fórmula 1, são vistos juntos na foto abaico</p>

        <img src="./img/pilotos.jpeg">
    </div>

    <div class="rodape">
        <span>Site Oficial Fórmula 1</span>
    </div>
</body>
</html>
